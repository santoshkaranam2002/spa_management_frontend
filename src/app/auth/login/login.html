<div class="login-page">

  <!-- soft decorative blooms -->
  <span class="bloom bloom--1"></span>
  <span class="bloom bloom--2"></span>

  <div class="login-wrap">

    <!-- Brand -->
    <div class="brand">
      <div class="brand__mark">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c2.5 2.5 2.5 6.5 0 9-2.5-2.5-2.5-6.5 0-9z"/>
          <path d="M12 12c3.5 0 6.5-1.5 8-3.5C18.5 12 15.5 14 12 14s-6.5-2-8-5.5C5.5 10.5 8.5 12 12 12z"/>
          <path d="M12 12v8"/>
        </svg>
      </div>
      <h1 class="brand__name">Spot Booking</h1>
      <p class="brand__sub">Spa &amp; Wellness Suite</p>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card__head">
        <h2>Welcome back</h2>
        <p>Sign in to your admin account to continue</p>
      </div>

      <!-- Email / Phone -->
      <label class="field-label">Email or Phone</label>
      <div class="field">
        <svg class="field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
        <input type="text" [(ngModel)]="email" placeholder="you@serenespa.com" />
      </div>

      <!-- Password -->
      <label class="field-label">Password</label>
      <div class="field">
        <svg class="field__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="9" rx="2"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
        <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Enter your password" />
        <button type="button" class="field__eye" (click)="togglePassword()" aria-label="Toggle password">
          @if (showPassword) {
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3l18 18"/>
              <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3 3.9"/>
              <path d="M6.6 6.6A18 18 0 0 0 2 12s3.5 7 10 7a10.9 10.9 0 0 0 4-.7"/>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
          }
        </button>
      </div>

      <!-- Remember / Forgot -->
      <div class="row">
        <label class="check">
          <input type="checkbox" [(ngModel)]="rememberMe" />
          <span class="box"></span>
          Remember me
        </label>
        <a class="link" href="javascript:void(0)">Forgot password?</a>
      </div>

      <!-- Sign in -->
      <button class="signin" (click)="signIn()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
        </svg>
        Sign In
      </button>

      <p class="foot-link">Don't have an account? <a class="link" href="javascript:void(0)">Create account</a></p>
    </div>

    
  </div>
</div>
